# AI Enterprise Assistant — jalankan: docker compose up --build   → buka http://localhost:8080
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://ai:${POSTGRES_PASSWORD:-ai_password}@postgres:5432/aiassistant
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-please-use-32+chars}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@company.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  USE_CELERY: "true"
  AUTO_SEED: ${AUTO_SEED:-true}
  UPLOAD_DIR: /data/uploads
  REPORTS_DIR: /data/reports
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-postgres
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_password}
      POSTGRES_DB: aiassistant
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d aiassistant"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ai-backend
    environment: *backend-env
    volumes:
      - appdata:/data
      - ./ml:/ml:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: ai-worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2
    environment: *backend-env
    volumes:
      - appdata:/data
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: ai-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
